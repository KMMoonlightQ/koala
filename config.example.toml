# 首次运行 koala 会自动创建 ~/.koala/config.toml 并引导设置。
# 此模板用于参考高级选项，也可手动复制后编辑。
# 界面语言：en（默认）或 zh。也可用 /lang 在对话中切换，或用 KOALA_LANG 覆盖。
# lang = "zh"

# 主题：auto（默认，跟随终端配色）、light 或 dark。支持 /theme 和 KOALA_THEME。
# theme = "auto"

[llm]
provider = "openai_compatible"              # 原生服务可填 anthropic、gemini、openai、deepseek 等；原生服务的 base_url 可留空
base_url = "https://api.openai.com/v1"     # OpenAI 兼容端点；使用原生 provider 时删除本行或置空
api_key = "sk-xxx"                          # provider 的 key，或用环境变量 KOALA_API_KEY 覆盖
model = "gpt-4o-mini"                       # 模型名

# 推理档位按服务商实际能力填写；上下文容量自动识别，手填仅作兜底。
# reasoning_efforts = ["low", "medium", "high"] # 可选档位及弹窗顺序
# reasoning_effort = "medium"                  # 初始档位，省略则取列表第一项
# context_window = 128000                      # 自动识别失败时的上下文容量（tokens）

# 额外的请求头：某些"OpenAI 兼容"端点要求额外的路由头时填这里，每个请求都会携带
# [llm.headers]
# x-opencode-session = "koala"

# /model 中的额外模型，共用上面的 base_url、api_key 和 headers。
# 若列表包含 llm.model 的同名项，以该项的能力配置为准。
# [[llm.models]]
# model = "your-other-model"
# reasoning_efforts = ["low", "medium", "high"]
# reasoning_effort = "medium"
# context_window = 128000


[agent]
max_tool_rounds = "unlimited"           # 不限制轮数；非负整数设置上限，0 禁止工具调用
max_retries = 5
compact_threshold = 75                   # 达到上下文窗口的 75% 时压缩，取值 1..100
subagent_max_rounds = "unlimited"
session_dir = ".koala/session"              # 会话转录目录：通用 JSONL 会话转录
# memory_file = "..."                    # 结构化私有记忆，默认 ~/.koala/memory.json
# memory_read = true                     # 自动加载索引及 recall；与写入开关独立
# memory_write = true                    # remember 更新/删除；不影响已有条目的读取
# memory_index_bytes = 4000              # 索引 UTF-8 字节预算，限制在 1024..=32000

# 权限等级：normal / ask_when_need / auto_edit / never_ask
# 对话内 /permissions 切换；方向键选择，Enter 确认，Esc 取消
[permissions]
mode = "ask_when_need"
# allow 在 ask_when_need / auto_edit 下自动放行指定工具；所有档位都优先执行 deny。
# never_ask 自动放行未被 deny 禁止的工具，不再请求审批。
allow = []
deny = []

# hooks：每条是一个 shell 命令，stdin 收到 JSON 事件，超时 10s
# pre_tool_use  非零退出、超时或执行失败 = 阻断该工具调用（stderr 作为原因回喂模型）
[hooks]
pre_tool_use = []
post_tool_use = []
turn_start = []
turn_end = []

# Extensions are trusted local programs. All extensions load in the listed order.
[extensions]
manifests = [] # e.g. ["/absolute/path/to/.koala/extensions/context-example/extension.toml"]
timeout_secs = 30

# MCP 客户端（可配置多个服务器；修改后重启）
# 本地 stdio：command 是可执行程序，args 不经过 shell 展开。
# [mcp.servers.local]
# command = "python3"
# args = ["/absolute/path/to/server.py"]
# cwd = "/absolute/path/to/workspace"
# env = { API_KEY = "your-key" }
# startup_timeout_secs = 30
# timeout_secs = 60
# enabled = true
# read_only_tools = ["search"] # 原始工具名；显式信任其只读性

# 远程 Streamable HTTP：url 与 command 二选一。
# [mcp.servers.remote]
# url = "https://example.com/mcp"
# headers = { X-Project = "my-project" }
# bearer_token_env = "MY_MCP_TOKEN" # 从环境变量读取 Bearer token
# read_only_tools = []
