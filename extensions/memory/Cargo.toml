[package]
name = "koala-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
ring = "0.17.14"
pulldown-cmark = "0.13.4"
koala-extension-api = { path = "../../crates/extension-api" }
koala-llm = { path = "../../crates/llm" }
koala-markdown = { path = "../../crates/markdown" }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.13"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"

[dev-dependencies]
koala-test-support = { path = "../../crates/test-support" }
koala-extensions = { path = "../../crates/extensions" }
uuid = { version = "1.26.1", features = ["v4"] }
