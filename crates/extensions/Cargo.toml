[package]
name = "koala-extensions"
version = "0.1.0"
edition = "2024"

[dependencies]
koala-extension-api = { path = "../extension-api" }
koala-process = { path = "../process" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"

[dev-dependencies]
uuid = { version = "1.26.1", features = ["v4"] }
